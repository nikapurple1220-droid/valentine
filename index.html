<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine 🤍</title>

  <style>
    body {
      font-family: "Comic Sans MS", Arial, sans-serif;
      background: #f7f1e8; /* cream */
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 620px;
      width: 90%;
      background: white;
      padding: 50px 40px 60px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0,0,0,0.15);
    }

    .image-top {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    .image-top img {
      width: 180px;
      max-width: 90%;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 35px;
    }

    button {
      padding: 12px 22px;
      font-size: 1rem;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background: #d88c9a;
      color: white;
    }

    #noBtn {
      background: #e0e0e0;
    }

    #message {
      margin-top: 28px;
      font-size: 1.1rem;
      min-height: 28px;
    }
  </style>
</head>

<body>

  <div class="container" id="card">
    <div class="image-top">
      <img
        src="couple.png"
        alt="cute cartoon couple"
      />
    </div>

    <h1>Faisal, will you be my Valentine? 🤍</h1>

    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">No 🙃</button>

    <div id="message"></div>
  </div>

  <script>
    const noMessages = [
      "Are you sure? 🥺",
      "Are you sureeeee 😭",
      "Are you very sureeee?",
      "Are you VERY very suree??",
      "Hmm… think again 😐",
      "This is starting to feel wrong 😔",
      "You’re kinda being rude now 😶",
      "Damn… that actually hurts 💔",
      "Wow. Ouch.",
      "Okay this is emotional damage.",
      "Do you enjoy my suffering?",
      "I’m judging you silently 😤",
      "Last chance. Seriously.",
      "WOW still no??",
      "Okay fine. Resetting 😒"
    ];

    let noCount = 0;
    let yesSize = 16;

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    noBtn.onclick = () => {
      message.innerText = noMessages[noCount];
      yesSize += 6;
      yesBtn.style.fontSize = yesSize + "px";
      noCount++;

      if (noCount === noMessages.length) {
        setTimeout(() => {
          alert("Okay okay 😤 let’s try that again properly.");
          location.reload();
        }, 700);
      }
    };

    yesBtn.onclick = () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          background:#f7f1e8;
          display:flex;
          align-items:center;
          justify-content:center;
          text-align:center;
          font-family:Comic Sans MS, Arial;
        ">
          <div>
            <h1>YAYYYYY 💖🥰</h1>
            <p style="font-size:1.3rem">You’re officially my Valentine 🤍</p>
            <p>Now screenshot this and send it 😌</p>
          </div>
        </div>
      `;
    };
  </script>

</body>
</html>
